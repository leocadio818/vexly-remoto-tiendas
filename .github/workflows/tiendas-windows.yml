# Vexly Remoto — instaladores de Windows 64 bits con la llave propia de perfiles.
# Solo Windows x64 (no compila Mac, Linux ni Android, para no gastar minutos).
# Sale al prerelease "vexly" de este repo (el que lee el panel en Descargas):
#   vexlyremoto-<versión>.<build>-x86_64.exe          (cliente)
#   vexlyremoto-tecnico-<versión>.<build>-x86_64.exe  (técnico)
#   vexlyremoto-<versión>.<build>-x86_64.msi          (cliente, msi)
# Sin certificado de Windows: al abrirlos, SmartScreen muestra el aviso azul.
name: tiendas-windows

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CANELA_BUILD: ${{ github.run_number }}
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"
  TAG_NAME: "vexly"

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  windows:
    needs: [bridge, topmost]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      # --- Lo nuestro: perfiles firmados con la llave propia (antes de compilar Rust) ---
      - name: Perfiles firmados con la llave propia de Vexly
        shell: bash
        env:
          VEXLY_PERFIL_KEY: ${{ secrets.VEXLY_PERFIL_KEY }}
        run: |
          python3 -m pip install --quiet pynacl
          python3 vexly/firmar-perfiles.py

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Pantalla virtual (usbmmidd_v2), igual que el build original
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Vexly Remoto - instaladores exe (cliente y técnico)
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/dpiAware/d' res/manifest.xml
          (cd libs/portable && pip3 install -r requirements.txt)
          mkdir -p ./SignOutput
          curl -sSL -o ./rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          echo "3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a  ./rcedit.exe" | sha256sum -c -
          for variant in cliente tecnico; do
            rm -rf ./canela-dist && cp -r ./rustdesk ./canela-dist
            rm -rf ./canela-dist/printer_driver_adapter.dll ./canela-dist/drivers/RustDeskPrinterDriver
            mv ./canela-dist/rustdesk.exe ./canela-dist/VexlyRemoto.exe
            cp "canela/custom-$variant.txt" ./canela-dist/custom.txt
            suffix=""
            if [ "$variant" = "tecnico" ]; then
              suffix="-tecnico"
              ./rcedit.exe ./canela-dist/VexlyRemoto.exe --set-icon canela/icon-tecnico.ico --set-version-string FileDescription "Vexly Remoto Tecnico"
            fi
            pushd ./libs/portable
            python3 ./generate.py -f ../../canela-dist/ -o . -e ../../canela-dist/VexlyRemoto.exe
            popd
            out="./SignOutput/vexlyremoto$suffix-${{ env.VERSION }}.${{ env.CANELA_BUILD }}-x86_64.exe"
            mv ./target/release/rustdesk-portable-packer.exe "$out"
            if [ "$variant" = "tecnico" ]; then
              ./rcedit.exe "$out" --set-icon canela/icon-tecnico.ico --set-version-string FileDescription "Vexly Remoto Tecnico"
            fi
          done
          ls -la ./SignOutput

      - name: Vexly Remoto - msi cliente
        run: |
          if (Test-Path ./canela-dist) { Remove-Item -Recurse -Force ./canela-dist }
          Copy-Item -Recurse ./rustdesk ./canela-dist
          Remove-Item -Recurse -Force ./canela-dist/printer_driver_adapter.dll, ./canela-dist/drivers/RustDeskPrinterDriver -ErrorAction SilentlyContinue
          Rename-Item ./canela-dist/rustdesk.exe VexlyRemoto.exe
          Copy-Item canela/custom-cliente.txt ./canela-dist/custom.txt
          Copy-Item canela/License.rtf res/msi/Package/License.rtf
          pushd ./res/msi
          python preprocess.py --arp -c --app-name VexlyRemoto -m "BRIGHTWAY SOLUTIONS LLC" -d ../../canela-dist
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/vexlyremoto-${{ env.VERSION }}.${{ env.CANELA_BUILD }}-x86_64.msi
          popd

      - name: canela-build.json (numero de version para el boton Actualizar)
        shell: bash
        run: |
          printf '{"build":%s,"version":"%s","sha":"%s","published_at":"%s"}\n' \
            "${{ env.CANELA_BUILD }}" "${{ env.VERSION }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" > ./SignOutput/canela-build.json
          cat ./SignOutput/canela-build.json

      - name: Guardar como artifact del run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vexlyremoto-windows
          path: ./SignOutput/vexlyremoto*

      - name: Publicar en el prerelease vexly
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: |
            ./SignOutput/vexlyremoto*.exe
            ./SignOutput/vexlyremoto*.msi
            ./SignOutput/canela-build.json

      - name: Borrar instaladores de Windows de builds anteriores
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # quedan solo los .exe/.msi de este build; los APK de Android no se tocan
          gh release view "${{ env.TAG_NAME }}" -R "${{ github.repository }}" --json assets --jq '.assets[].name' \
            | grep -E '^vexlyremoto.*\.(exe|msi)$' | grep -v "\.${{ env.CANELA_BUILD }}-" | while read -r a; do
                echo "borrando $a"; gh release delete-asset "${{ env.TAG_NAME }}" "$a" -R "${{ github.repository }}" -y
              done || true
