# Vexly Remoto — versión TÉCNICO para iPhone → TestFlight (cuenta de Apple de Brightway)
# Archivo nuestro: no toca el código de Canela. Los cambios para iOS se hacen aquí, al compilar.
#
# Secretos que pone Leo (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID  ID del equipo de Apple de Brightway (10 caracteres)
#   ASC_KEY_ID     Key ID de la llave de API de App Store Connect
#   ASC_ISSUER_ID  Issuer ID de esa llave
#   ASC_KEY_P8     contenido completo del archivo .p8 de esa llave

name: tiendas-ios

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 1 * *" # día 1 de cada mes: una versión nueva antes de que venzan los 90 días de TestFlight

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  ios:
    needs: bridge
    runs-on: macos-latest
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: brew install nasm yasm

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: aarch64-apple-ios

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        run: cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      # --- Lo nuestro ---

      - name: Perfil técnico (servidor remoto.vexlyapp.com)
        run: cp canela/custom-tecnico.txt flutter/assets/canela_custom.txt

      - name: Nombre "Vexly Remoto" y declaración de cifrado
        run: |
          P=flutter/ios/Runner/Info.plist
          plutil -replace CFBundleDisplayName -string "Vexly Remoto" "$P"
          plutil -replace CFBundleName -string "Vexly Remoto" "$P"
          plutil -replace ITSAppUsesNonExemptEncryption -bool YES "$P"

      - name: Compilar Flutter (sin firmar)
        run: |
          cd flutter
          flutter build ios --release --no-codesign --build-number ${{ github.run_number }}

      - name: Firmar y subir a TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/asc_key.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Se archiva sin firmar: la firma de App Store la pone -exportArchive (no hace falta registrar iPhones)
          cd flutter/ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive

          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"

      - name: Borrar la llave
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
