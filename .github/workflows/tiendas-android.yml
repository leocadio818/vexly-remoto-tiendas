# Vexly Remoto — APK de Android (cliente y técnico) con la llave propia de perfiles
# y firmados con la keystore de Brightway (secretos VEXLY_ANDROID_KEYSTORE / _PASS).
# Una sola APK "universal" por versión (sirve en celulares, tablets y cajas Android).
# Sale al prerelease "vexly-android" de este repo:
#   vexlyremoto-<versión>.<build>-universal.apk          (cliente)
#   vexlyremoto-tecnico-<versión>.<build>-universal.apk  (técnico)
name: tiendas-android

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"
  NDK_VERSION: "r28c"
  TAG_NAME: "vexly-android"

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  # Parte de Rust (librustdesk.so) para cada procesador, con la llave pública propia adentro
  lib:
    needs: [bridge]
    name: librería ${{ matrix.job.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        job:
          - { target: aarch64-linux-android, script: ndk_arm64.sh }
          - { target: armv7-linux-androideabi, script: ndk_arm.sh }
          - { target: x86_64-linux-android, script: ndk_x64.sh }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
               libclang-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          case ${{ matrix.job.target }} in
            aarch64-linux-android) ANDROID_TARGET=arm64-v8a ;;
            armv7-linux-androideabi) ANDROID_TARGET=armeabi-v7a ;;
            x86_64-linux-android) ANDROID_TARGET=x86_64 ;;
          esac
          if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: vexly-android
          key: ${{ matrix.job.target }}

      # --- Lo nuestro: llave pública propia dentro de la librería (antes de compilar Rust) ---
      - name: Perfiles firmados con la llave propia de Vexly
        env:
          VEXLY_PERFIL_KEY: ${{ secrets.VEXLY_PERFIL_KEY }}
        run: |
          python3 -m pip install --quiet --break-system-packages pynacl
          python3 vexly/firmar-perfiles.py

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.script }}

      - name: Guardar la librería
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librustdesk.so.${{ matrix.job.target }}
          path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so

      # Los perfiles firmados en este job son iguales en los tres (misma llave, mismo JSON);
      # se guardan una vez para que el job del APK los use sin volver a firmar.
      - name: Guardar los perfiles firmados
        if: matrix.job.target == 'aarch64-linux-android'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perfiles-firmados
          path: canela/custom-*.txt

  apk:
    needs: [bridge, lib]
    name: APK universal (cliente y técnico)
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless zip unzip

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.aarch64-linux-android
          path: ./flutter/android/app/src/main/jniLibs/arm64-v8a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.armv7-linux-androideabi
          path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.x86_64-linux-android
          path: ./flutter/android/app/src/main/jniLibs/x86_64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: perfiles-firmados
          path: ./canela

      - name: Compilar APK universal (sin firma final)
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          J=./flutter/android/app/src/main/jniLibs
          S=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib
          mv $J/arm64-v8a/liblibrustdesk.so $J/arm64-v8a/librustdesk.so
          cp $S/aarch64-linux-android/libc++_shared.so $J/arm64-v8a/
          mv $J/armeabi-v7a/liblibrustdesk.so $J/armeabi-v7a/librustdesk.so
          cp $S/arm-linux-androideabi/libc++_shared.so $J/armeabi-v7a/
          mv $J/x86_64/liblibrustdesk.so $J/x86_64/librustdesk.so
          cp $S/x86_64-linux-android/libc++_shared.so $J/x86_64/
          (cd flutter && flutter build apk --release --target-platform android-arm64,android-arm,android-x64)
          cp ./flutter/build/app/outputs/flutter-apk/app-release.apk ./base.apk

      - name: Marca, perfil y firma de Brightway
        shell: bash
        env:
          KS_B64: ${{ secrets.VEXLY_ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.VEXLY_ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          [ -n "$KS_B64" ] || { echo "ERROR: falta el secreto VEXLY_ANDROID_KEYSTORE"; exit 1; }
          [ -n "$KS_PASS" ] || { echo "ERROR: falta el secreto VEXLY_ANDROID_KEYSTORE_PASS"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); echo "build-tools: $BT"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          # Comprobación: la llave se abre con la contraseña (si no, se detiene sin publicar nada)
          /usr/lib/jvm/java-17-openjdk-amd64/bin/keytool -list -keystore "$RUNNER_TEMP/ks.jks" -storepass:env KS_PASS -alias vexlyremoto > /dev/null || { echo "ERROR: la llave de Android no abre con esa contrasena o no tiene el alias vexlyremoto"; rm -f "$RUNNER_TEMP/ks.jks"; exit 1; }
          echo "OK llave de Android"
          mkdir -p out
          for variant in cliente tecnico; do
            suffix=""; [ "$variant" = "tecnico" ] && suffix="-tecnico"
            work="$RUNNER_TEMP/work.apk"; cp base.apk "$work"
            zip -q -d "$work" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
            stage="$RUNNER_TEMP/stage"; rm -rf "$stage"; mkdir -p "$stage/assets/flutter_assets/assets"
            cp "canela/custom-$variant.txt" "$stage/assets/flutter_assets/assets/canela_custom.txt"
            (cd "$stage" && zip -q "$work" assets/flutter_assets/assets/canela_custom.txt)
            "$BT/zipalign" -P 16 -f 4 "$work" "$RUNNER_TEMP/aligned.apk" || "$BT/zipalign" -p -f 4 "$work" "$RUNNER_TEMP/aligned.apk"
            outapk="out/vexlyremoto$suffix-$VERSION.${{ github.run_number }}-universal.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass env:KS_PASS --ks-key-alias vexlyremoto --out "$outapk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "$outapk" | head -2
            unzip -l "$outapk" | grep -q canela_custom.txt && echo "OK $outapk con $variant"
          done
          rm -f "$RUNNER_TEMP/ks.jks"
          ls -la out

      - name: Guardar como artifact del run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vexlyremoto-android
          path: out/vexlyremoto*.apk

      - name: Publicar en el prerelease vexly-android
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          files: out/vexlyremoto*.apk
